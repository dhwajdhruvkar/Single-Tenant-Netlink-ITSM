name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm
          POSTGRES_DB: itsm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Create shadow database for the migration drift check
        run: PGPASSWORD=itsm psql -h localhost -U itsm -d itsm_test -c 'CREATE DATABASE itsm_shadow'
      - name: Migration drift check (migrations vs schema.prisma)
        run: >-
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://itsm:itsm@localhost:5432/itsm_shadow --exit-code
        env:
          DATABASE_URL: postgresql://itsm:itsm@localhost:5432/itsm_test
          DIRECT_URL: postgresql://itsm:itsm@localhost:5432/itsm_test
      - name: Integration tests (applies migrations to the CI database first)
        run: npm run test:integration
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-build-secret
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t netlink-itsm:ci .
