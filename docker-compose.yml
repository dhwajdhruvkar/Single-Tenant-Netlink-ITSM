# Local development Postgres only. Never point this project's tooling at a cloud database.
# Default major version 17 is the conservative choice until company IT confirms ([OPEN]).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm
      POSTGRES_DB: itsm_dev
    ports:
      - "5432:5432"
    volumes:
      - itsm_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm -d itsm_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  itsm_pgdata:
